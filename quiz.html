<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Quiz - Find Your Perfect Tool | SaaS Radar Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap');
        
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        body { 
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f1b2e 0%, #1a2847 50%, #0f1b2e 100%);
            min-height: 100vh;
        }
        
        .glow-text {
            background: linear-gradient(135deg, #d4a574 0%, #f5d5a8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .button-hover {
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .button-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 40px rgba(212, 165, 116, 0.2);
        }
        
        #root {
            width: 100%;
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- React Libraries -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons via CDN -->
    <script>
        // Simple SVG icons inline (since lucide-react may not work via CDN in this context)
        const ChevronRight = ({ size = 24 }) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>`;
        const Mail = ({ size = 24 }) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>`;
        const ArrowRight = ({ size = 24 }) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>`;
        const Check = ({ size = 24 }) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
    </script>

    <script type="text/babel">
        const { useState } = React;

        const SaaSQuiz = () => {
            const [stage, setStage] = useState('intro'); // intro, quiz, email, results
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [answers, setAnswers] = useState({});
            const [email, setEmail] = useState('');
            const [score, setScore] = useState(null);

            const questions = [
                {
                    id: 'company_size',
                    question: 'What\'s your company size?',
                    answers: [
                        { text: 'Solo / Freelancer', value: 'solo' },
                        { text: '2-10 people', value: 'small' },
                        { text: '11-50 people', value: 'medium' },
                        { text: '50+ people', value: 'enterprise' }
                    ]
                },
                {
                    id: 'budget',
                    question: 'What\'s your monthly SaaS budget?',
                    answers: [
                        { text: '$0-50', value: 'minimal' },
                        { text: '$50-200', value: 'starter' },
                        { text: '$200-1000', value: 'growth' },
                        { text: '$1000+', value: 'enterprise' }
                    ]
                },
                {
                    id: 'primary_need',
                    question: 'What\'s your primary pain point?',
                    answers: [
                        { text: 'Customer Management (CRM)', value: 'crm' },
                        { text: 'Project Management', value: 'pm' },
                        { text: 'Marketing Automation', value: 'marketing' },
                        { text: 'Finances & Accounting', value: 'finance' },
                        { text: 'Communications', value: 'comms' }
                    ]
                },
                {
                    id: 'priority',
                    question: 'What matters most to you?',
                    answers: [
                        { text: 'Ease of Use', value: 'easy' },
                        { text: 'Advanced Features', value: 'features' },
                        { text: 'Best Price', value: 'price' },
                        { text: 'Integration Capacity', value: 'integration' }
                    ]
                },
                {
                    id: 'timeline',
                    question: 'When do you need to implement?',
                    answers: [
                        { text: 'Immediately (this week)', value: 'urgent' },
                        { text: 'Soon (this month)', value: 'soon' },
                        { text: 'Planning (next quarter)', value: 'planning' },
                        { text: 'Just researching', value: 'research' }
                    ]
                }
            ];

            const recommendations = {
                crm: {
                    title: 'Best CRM Solutions for You',
                    tools: [
                        { name: 'HubSpot', description: 'Complete CRM with marketing & sales automation', match: 95, link: 'https://hubspot.com' },
                        { name: 'Pipedrive', description: 'Sales-focused CRM with beautiful interface', match: 88, link: 'https://pipedrive.com' },
                        { name: 'Zoho CRM', description: 'Affordable with powerful features', match: 85, link: 'https://zoho.com/crm' }
                    ]
                },
                pm: {
                    title: 'Best Project Management Tools for You',
                    tools: [
                        { name: 'Monday.com', description: 'Visual project management with automation', match: 92, link: 'https://monday.com' },
                        { name: 'Asana', description: 'Flexible workflows for any team size', match: 89, link: 'https://asana.com' },
                        { name: 'Notion', description: 'All-in-one workspace at great price', match: 86, link: 'https://notion.so' }
                    ]
                },
                marketing: {
                    title: 'Best Marketing Automation for You',
                    tools: [
                        { name: 'HubSpot Marketing', description: 'Complete marketing automation platform', match: 94, link: 'https://hubspot.com/marketing' },
                        { name: 'Mailchimp', description: 'Email marketing with automation', match: 87, link: 'https://mailchimp.com' },
                        { name: 'ActiveCampaign', description: 'Powerful automation for SMBs', match: 85, link: 'https://activecampaign.com' }
                    ]
                },
                finance: {
                    title: 'Best Accounting & Finance Tools for You',
                    tools: [
                        { name: 'Xero', description: 'Cloud accounting with automation', match: 93, link: 'https://xero.com' },
                        { name: 'FreshBooks', description: 'Invoicing & time tracking', match: 88, link: 'https://freshbooks.com' },
                        { name: 'Wave', description: 'Free accounting software', match: 82, link: 'https://waveapps.com' }
                    ]
                },
                comms: {
                    title: 'Best Communication Tools for You',
                    tools: [
                        { name: 'Slack', description: 'Team messaging & collaboration', match: 94, link: 'https://slack.com' },
                        { name: 'Microsoft Teams', description: 'Integrated with Office 365', match: 90, link: 'https://teams.microsoft.com' },
                        { name: 'Discord', description: 'Community & team chat', match: 87, link: 'https://discord.com' }
                    ]
                }
            };

            const handleAnswer = (value) => {
                setAnswers({ ...answers, [questions[currentQuestion].id]: value });
                if (currentQuestion < questions.length - 1) {
                    setCurrentQuestion(currentQuestion + 1);
                } else {
                    const needValue = answers.primary_need || 'crm';
                    setScore(needValue);
                    setStage('email');
                }
            };

            const handleEmailSubmit = async (e) => {
                e.preventDefault();
                if (email) {
                    // Log for testing (in production, send to backend)
                    console.log('Email captured:', email);
                    console.log('Answers:', answers);
                    setStage('results');
                }
            };

            // INTRO STAGE
            if (stage === 'intro') {
                return (
                    <div style={{
                        minHeight: '100vh',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        padding: '1rem'
                    }}>
                        <div style={{ maxWidth: '800px', width: '100%' }}>
                            <div style={{ textAlign: 'center', marginBottom: '3rem' }}>
                                <h1 style={{
                                    fontSize: '3rem',
                                    fontWeight: 'bold',
                                    marginBottom: '1.5rem',
                                    fontFamily: "'Playfair Display', serif",
                                    color: 'white'
                                }}>
                                    Find Your Perfect<br/>
                                    <span className="glow-text">SaaS Match</span>
                                </h1>
                                <p style={{
                                    color: '#d1d5db',
                                    fontSize: '1.125rem',
                                    lineHeight: 1.6,
                                    maxWidth: '600px',
                                    margin: '0 auto'
                                }}>
                                    Answer 5 quick questions and get personalized software recommendations tailored to your business needs, budget, and goals.
                                </p>
                            </div>

                            <div style={{
                                background: 'rgba(255,255,255,0.05)',
                                backdropFilter: 'blur(10px)',
                                border: '1px solid rgba(255,255,255,0.1)',
                                borderRadius: '1rem',
                                padding: '2rem',
                                marginBottom: '2rem'
                            }}>
                                <div style={{
                                    display: 'grid',
                                    gridTemplateColumns: 'repeat(3, 1fr)',
                                    gap: '1rem',
                                    marginBottom: '2rem'
                                }}>
                                    {[
                                        { icon: '⚡', label: '2 min Quiz' },
                                        { icon: '🎯', label: 'Personalized' },
                                        { icon: '💼', label: 'Expert Tips' }
                                    ].map((item, i) => (
                                        <div key={i} style={{ textAlign: 'center' }}>
                                            <div style={{ fontSize: '2rem', marginBottom: '0.5rem' }}>{item.icon}</div>
                                            <p style={{ color: '#d1d5db', fontSize: '0.875rem' }}>{item.label}</p>
                                        </div>
                                    ))}
                                </div>

                                <button
                                    onClick={() => setStage('quiz')}
                                    className="button-hover"
                                    style={{
                                        width: '100%',
                                        background: 'linear-gradient(to right, #d4a574, #f5d5a8)',
                                        color: '#0f1b2e',
                                        fontWeight: '600',
                                        padding: '1rem',
                                        borderRadius: '0.75rem',
                                        border: 'none',
                                        fontSize: '1.125rem',
                                        cursor: 'pointer',
                                        display: 'flex',
                                        alignItems: 'center',
                                        justifyContent: 'center',
                                        gap: '0.5rem'
                                    }}
                                >
                                    Start Quiz Now →
                                </button>
                            </div>

                            <p style={{
                                textAlign: 'center',
                                color: '#9ca3af',
                                fontSize: '0.875rem'
                            }}>
                                ✓ No spam. Your data is safe. We hate spam too.
                            </p>
                        </div>
                    </div>
                );
            }

            // QUIZ STAGE
            if (stage === 'quiz') {
                const question = questions[currentQuestion];
                const progress = ((currentQuestion + 1) / questions.length) * 100;

                return (
                    <div style={{
                        minHeight: '100vh',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        padding: '1rem'
                    }}>
                        <div style={{ maxWidth: '800px', width: '100%' }}>
                            <div style={{ marginBottom: '2rem' }}>
                                <div style={{
                                    display: 'flex',
                                    justifyContent: 'space-between',
                                    alignItems: 'center',
                                    marginBottom: '0.75rem'
                                }}>
                                    <span style={{ color: '#9ca3af', fontSize: '0.875rem' }}>
                                        Question {currentQuestion + 1} of {questions.length}
                                    </span>
                                    <span className="glow-text" style={{ fontSize: '0.875rem', fontWeight: '600' }}>
                                        {Math.round(progress)}%
                                    </span>
                                </div>
                                <div style={{
                                    height: '0.5rem',
                                    background: 'rgba(255,255,255,0.1)',
                                    borderRadius: '9999px',
                                    overflow: 'hidden'
                                }}>
                                    <div
                                        style={{
                                            height: '100%',
                                            background: 'linear-gradient(to right, #d4a574, #f5d5a8)',
                                            width: `${progress}%`,
                                            transition: 'width 0.3s ease'
                                        }}
                                    />
                                </div>
                            </div>

                            <div style={{ marginBottom: '3rem' }}>
                                <h2 style={{
                                    fontSize: '1.875rem',
                                    fontWeight: 'bold',
                                    color: 'white',
                                    marginBottom: '2rem',
                                    fontFamily: "'Playfair Display', serif"
                                }}>
                                    {question.question}
                                </h2>

                                <div style={{ display: 'grid', gap: '0.75rem' }}>
                                    {question.answers.map((answer, i) => (
                                        <button
                                            key={i}
                                            onClick={() => handleAnswer(answer.value)}
                                            className="button-hover"
                                            style={{
                                                width: '100%',
                                                background: 'rgba(255,255,255,0.05)',
                                                border: '1px solid rgba(255,255,255,0.1)',
                                                color: 'white',
                                                padding: '1.25rem',
                                                borderRadius: '0.75rem',
                                                textAlign: 'left',
                                                cursor: 'pointer',
                                                fontSize: '1.125rem',
                                                fontWeight: '500',
                                                transition: 'all 0.2s'
                                            }}
                                            onMouseEnter={(e) => {
                                                e.target.style.background = 'rgba(255,255,255,0.1)';
                                                e.target.style.borderColor = '#d4a574';
                                            }}
                                            onMouseLeave={(e) => {
                                                e.target.style.background = 'rgba(255,255,255,0.05)';
                                                e.target.style.borderColor = 'rgba(255,255,255,0.1)';
                                            }}
                                        >
                                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                                <span>{answer.text}</span>
                                                <span style={{ color: '#d4a574' }}>→</span>
                                            </div>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // EMAIL STAGE
            if (stage === 'email') {
                return (
                    <div style={{
                        minHeight: '100vh',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        padding: '1rem'
                    }}>
                        <div style={{ maxWidth: '600px', width: '100%' }}>
                            <div style={{ textAlign: 'center', marginBottom: '2rem' }}>
                                <div style={{
                                    width: '4rem',
                                    height: '4rem',
                                    background: 'linear-gradient(to right, #d4a574, #f5d5a8)',
                                    borderRadius: '0.5rem',
                                    display: 'flex',
                                    alignItems: 'center',
                                    justifyContent: 'center',
                                    margin: '0 auto 1.5rem',
                                    color: '#0f1b2e'
                                }}>
                                    ✉️
                                </div>
                                <h2 style={{
                                    fontSize: '2rem',
                                    fontWeight: 'bold',
                                    color: 'white',
                                    marginBottom: '1rem',
                                    fontFamily: "'Playfair Display', serif"
                                }}>
                                    One More Step!
                                </h2>
                                <p style={{
                                    color: '#d1d5db',
                                    fontSize: '1.125rem'
                                }}>
                                    Get your personalized recommendations + exclusive tips sent to your email
                                </p>
                            </div>

                            <form onSubmit={handleEmailSubmit} style={{
                                background: 'rgba(255,255,255,0.05)',
                                border: '1px solid rgba(255,255,255,0.1)',
                                borderRadius: '1rem',
                                padding: '2rem',
                                marginBottom: '1.5rem'
                            }}>
                                <input
                                    type="email"
                                    placeholder="your@email.com"
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    required
                                    style={{
                                        width: '100%',
                                        background: 'rgba(255,255,255,0.1)',
                                        border: '1px solid rgba(255,255,255,0.2)',
                                        borderRadius: '0.75rem',
                                        padding: '1rem',
                                        color: 'white',
                                        marginBottom: '1.5rem',
                                        fontSize: '1rem',
                                        fontFamily: 'inherit'
                                    }}
                                    onFocus={(e) => {
                                        e.target.style.borderColor = '#d4a574';
                                        e.target.style.background = 'rgba(255,255,255,0.15)';
                                    }}
                                    onBlur={(e) => {
                                        e.target.style.borderColor = 'rgba(255,255,255,0.2)';
                                        e.target.style.background = 'rgba(255,255,255,0.1)';
                                    }}
                                />

                                <button
                                    type="submit"
                                    className="button-hover"
                                    style={{
                                        width: '100%',
                                        background: 'linear-gradient(to right, #d4a574, #f5d5a8)',
                                        color: '#0f1b2e',
                                        fontWeight: '600',
                                        padding: '1rem',
                                        borderRadius: '0.75rem',
                                        border: 'none',
                                        fontSize: '1.125rem',
                                        cursor: 'pointer',
                                        display: 'flex',
                                        alignItems: 'center',
                                        justifyContent: 'center',
                                        gap: '0.5rem'
                                    }}
                                >
                                    Get My Recommendations →
                                </button>
                            </form>

                            <p style={{
                                textAlign: 'center',
                                color: '#6b7280',
                                fontSize: '0.75rem'
                            }}>
                                We respect your privacy. Unsubscribe anytime.
                            </p>
                        </div>
                    </div>
                );
            }

            // RESULTS STAGE
            if (stage === 'results') {
                const recs = recommendations[score] || recommendations.crm;

                return (
                    <div style={{
                        minHeight: '100vh',
                        background: 'linear-gradient(135deg, #0f1b2e 0%, #1a2847 50%, #0f1b2e 100%)',
                        padding: '3rem 1rem'
                    }}>
                        <div style={{ maxWidth: '1000px', margin: '0 auto' }}>
                            <div style={{ textAlign: 'center', marginBottom: '3rem' }}>
                                <div style={{
                                    display: 'inline-block',
                                    background: 'rgba(34, 197, 94, 0.2)',
                                    border: '1px solid rgba(34, 197, 94, 0.3)',
                                    borderRadius: '9999px',
                                    padding: '0.5rem 1rem',
                                    marginBottom: '1.5rem'
                                }}>
                                    <span style={{
                                        color: '#4ade80',
                                        fontSize: '0.875rem',
                                        fontWeight: '600',
                                        display: 'flex',
                                        alignItems: 'center',
                                        gap: '0.5rem'
                                    }}>
                                        ✓ Ready to Go!
                                    </span>
                                </div>
                                <h2 style={{
                                    fontSize: '2rem',
                                    fontWeight: 'bold',
                                    color: 'white',
                                    marginBottom: '1rem',
                                    fontFamily: "'Playfair Display', serif"
                                }}>
                                    {recs.title}
                                </h2>
                                <p style={{
                                    color: '#d1d5db',
                                    fontSize: '1.125rem',
                                    maxWidth: '600px',
                                    margin: '0 auto'
                                }}>
                                    Based on your answers, here are the top solutions matched to your needs
                                </p>
                            </div>

                            <div style={{
                                display: 'grid',
                                gap: '1rem',
                                marginBottom: '3rem'
                            }}>
                                {recs.tools.map((tool, i) => (
                                    <div
                                        key={i}
                                        style={{
                                            background: 'rgba(255,255,255,0.05)',
                                            border: '1px solid rgba(255,255,255,0.1)',
                                            borderRadius: '1rem',
                                            padding: '2rem',
                                            cursor: 'pointer',
                                            transition: 'all 0.2s'
                                        }}
                                        onMouseEnter={(e) => {
                                            e.currentTarget.style.background = 'rgba(255,255,255,0.1)';
                                            e.currentTarget.style.borderColor = '#d4a574';
                                        }}
                                        onMouseLeave={(e) => {
                                            e.currentTarget.style.background = 'rgba(255,255,255,0.05)';
                                            e.currentTarget.style.borderColor = 'rgba(255,255,255,0.1)';
                                        }}
                                    >
                                        <div style={{
                                            display: 'flex',
                                            justifyContent: 'space-between',
                                            alignItems: 'flex-start',
                                            marginBottom: '1rem'
                                        }}>
                                            <div>
                                                <h3 style={{
                                                    fontSize: '1.5rem',
                                                    fontWeight: 'bold',
                                                    color: 'white',
                                                    marginBottom: '0.5rem'
                                                }}>
                                                    {tool.name}
                                                </h3>
                                                <p style={{ color: '#d1d5db' }}>{tool.description}</p>
                                            </div>
                                            <div style={{ textAlign: 'right' }}>
                                                <div className="glow-text" style={{ fontSize: '1.875rem', fontWeight: 'bold' }}>
                                                    {tool.match}%
                                                </div>
                                                <div style={{ fontSize: '0.75rem', color: '#9ca3af' }}>Match</div>
                                            </div>
                                        </div>

                                        <div style={{
                                            height: '0.25rem',
                                            background: 'rgba(255,255,255,0.05)',
                                            borderRadius: '9999px',
                                            marginBottom: '1rem',
                                            overflow: 'hidden'
                                        }}>
                                            <div
                                                style={{
                                                    height: '100%',
                                                    background: 'linear-gradient(to right, #d4a574, #f5d5a8)',
                                                    width: `${tool.match}%`
                                                }}
                                            />
                                        </div>

                                        <a
                                            href={tool.link}
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            style={{
                                                display: 'inline-flex',
                                                alignItems: 'center',
                                                gap: '0.5rem',
                                                color: '#d4a574',
                                                fontWeight: '600',
                                                marginTop: '1rem',
                                                textDecoration: 'none',
                                                cursor: 'pointer'
                                            }}
                                            onMouseEnter={(e) => {
                                                e.target.style.color = '#f5d5a8';
                                            }}
                                            onMouseLeave={(e) => {
                                                e.target.style.color = '#d4a574';
                                            }}
                                        >
                                            Learn More →
                                        </a>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }
        };

        ReactDOM.render(<SaaSQuiz />, document.getElementById('root'));
    </script>
</body>
</html>
